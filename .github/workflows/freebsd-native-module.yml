name: FreeBSD native RTW88 and MT7902 module build

on:
  push:
    paths:
      - ".gitmodules"
      - "CMakeLists.txt"
      - "tools/build-native-module.sh"
      - "sys/dev/rtw88_native/**"
      - "sys/dev/mt76/mt7902/**"
      - "sys/modules/rtw88_native/**"
      - "sys/modules/mt7902_native/**"
      - "sys/modules/ng_ubt_mt7902/**"
      - "upstream/**"
      - ".gitignore"
      - ".github/workflows/freebsd-native-module.yml"
  pull_request:
    paths:
      - ".gitmodules"
      - "CMakeLists.txt"
      - "tools/build-native-module.sh"
      - "sys/dev/rtw88_native/**"
      - "sys/dev/mt76/mt7902/**"
      - "sys/modules/rtw88_native/**"
      - "sys/modules/mt7902_native/**"
      - "sys/modules/ng_ubt_mt7902/**"
      - "upstream/**"
      - ".gitignore"
      - ".github/workflows/freebsd-native-module.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test shared MT7902 RX descriptor parser
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sys/dev/mt76/mt7902 \
            tests/mt7902_rxdesc_test.c -o /tmp/mt7902_rxdesc_test
          /tmp/mt7902_rxdesc_test
      - name: Test shared MT7902 Wi-Fi capability parser
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sys/dev/mt76/mt7902 \
            tests/mt7902_caps_test.c -o /tmp/mt7902_caps_test
          /tmp/mt7902_caps_test
      - name: Test shared MT7902 Block Ack encoder
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sys/dev/mt76/mt7902 \
            tests/mt7902_ba_test.c -o /tmp/mt7902_ba_test
          /tmp/mt7902_ba_test
      - name: Test translated MT7902 RX reverse decoder
        run: |
          cc -std=c11 -Wall -Wextra -Werror -I sys/dev/mt76/mt7902 \
            tests/mt7902_rxtrans_test.c -o /tmp/mt7902_rxtrans_test
          /tmp/mt7902_rxtrans_test
      - uses: vmactions/freebsd-vm@v1
        with:
          release: "15.1"
          arch: "amd64"
          mem: "4096"
          copyback: false
          prepare: |
            pkg install -y git cmake
          run: |
            set -eu
            rm -rf /usr/src
            git clone --depth 1 --branch releng/15.1 https://git.freebsd.org/src.git /usr/src
            cmake -S . -B build -DFREEBSD_SRCROOT=/usr/src
            cmake --build build --verbose
            test -f build/if_rtw88_native.ko
            file build/if_rtw88_native.ko
            SRCROOT=/usr/src OUTDIR="$PWD/build-native" sh tools/build-native-module.sh
            test -s build-native/if_rtw88_native.ko
            test -s build-native/if_mt7902_native.ko
            test -s build-native/ng_ubt_mt7902.ko
            file build-native/if_rtw88_native.ko
            file build-native/if_mt7902_native.ko
            file build-native/ng_ubt_mt7902.ko
